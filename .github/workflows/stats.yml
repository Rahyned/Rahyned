name: Racha de contribuciones

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Generar racha
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&background=F7F4EF&border=221F1A&stroke=221F1A&ring=FF4D5E&fire=FFC53D&currStreakNum=221F1A&sideNums=221F1A&currStreakLabel=116E7A&sideLabels=116E7A&dates=221F1A&border_radius=0&locale=es
          path: profile/streak.svg
          # Para contar contribuciones privadas, creá el secret STREAK_STATS_TOKEN
          # (PAT con scope repo) y activá "Private contributions" en tu perfil.
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit de la racha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: actualizar racha de contribuciones" || exit 0
          git push
